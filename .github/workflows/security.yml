name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  dependency-audit-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and auditor
        run: python -m pip install --upgrade pip . pip-audit
      - name: Audit dependencies
        run: pip-audit --local
      - name: Generate CycloneDX SBOM
        run: pip-audit --local --format cyclonedx-json --output sbom.cdx.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-harness-sbom
          path: sbom.cdx.json
