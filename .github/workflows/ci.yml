name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install quality tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q evaluate.py tests
      - name: Lint
        run: ruff check . --output-format=github
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=85
      - name: Smoke test JSON report
        run: python evaluate.py sample_cases.json
      - name: Smoke test HTML report
        run: python evaluate.py sample_cases.json --html /tmp/evaluation-report.html
