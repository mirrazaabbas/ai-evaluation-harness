name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install quality and build tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt build
      - name: Compile sources
        run: python -m compileall -q evaluate.py advanced_metrics.py portfolio_bridge.py semantic_metrics.py history.py suite_runner.py src tests
      - name: Lint
        run: ruff check . --output-format=github
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=85
      - name: Smoke test JSON report
        run: python evaluate.py sample_cases.json
      - name: Smoke test HTML report
        run: python evaluate.py sample_cases.json --html /tmp/evaluation-report.html
      - name: Evaluate RAG-agent integration evidence
        run: python portfolio_bridge.py sample_portfolio_run.json sample_portfolio_expected.json --output /tmp/portfolio-evaluation.json
      - name: Run expanded portfolio benchmark suite
        run: python suite_runner.py benchmark_suites/portfolio_suite.json --output /tmp/portfolio-suite.json
      - name: Build installable package
        run: python -m build
      - name: Install wheel and smoke-test CLI
        run: |
          python -m pip install --force-reinstall dist/*.whl
          ai-eval suite benchmark_suites/portfolio_suite.json
