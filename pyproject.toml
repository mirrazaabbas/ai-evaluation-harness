[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["evaluate", "advanced_metrics", "portfolio_bridge"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "def main\\(\\) -> None:",
  "if __name__ == .__main__.:",
]
